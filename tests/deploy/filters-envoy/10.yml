            http_filters:
            - name: envoy.filters.http.router
    clusters:
    - name: local_app
      connect_timeout: 0.25s
      type: STATIC
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: local_app
        endpoints:
        - lb_endpoints:
          - endpoint:
              address:
                socket_address:
                  address: 127.0.0.1
                  port_value: 8082
---
apiVersion: k8sidecar.io/v1
kind: Filter
metadata:
  name: datamesh
spec:
  sidecars:
    - image: "routerdi1315.uv.es:33443/sidecar/datamesh-sidecar:2.0.8"
      name: "datamesh"
    - image: "envoyproxy/envoy:v1.18.3"
      name: "envoy"
      volumeMounts:
        - name: "envoy-config-volume"
          mountPath: /etc/envoy
  volumes:
      - name: envoy-config-volume
        configMap:
          name: envoy-config