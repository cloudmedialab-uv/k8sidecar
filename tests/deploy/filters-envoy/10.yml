apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-config
data:
  envoy.yaml: |
    static_resources:
    listeners:
    - name: local_listener
      address:
        socket_address:
          address: "127.0.0.1"
          port_value: 8081
      filter_chains:
      - filters:
        - name: envoy.filters.network.http_connection_manager_1
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
            stat_prefix: ingress_http_1
            route_config:
              name: local_route_1
              virtual_hosts:
              - name: backend
                domains: ["*"]
                routes:
                - match:
                    prefix: "/"
                  route:
                    cluster: local_app
            http_filters:
            - name: envoy.filters.http.router
        - name: envoy.filters.network.http_connection_manager_2
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
            stat_prefix: ingress_http_2
            route_config:
              name: local_route_2
              virtual_hosts:
              - name: backend
                domains: ["*"]
                routes:
                - match:
                    prefix: "/"
                  route:
                    cluster: local_app
            http_filters:
            - name: envoy.filters.http.router
        - name: envoy.filters.network.http_connection_manager_3
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
            stat_prefix: ingress_http_3
